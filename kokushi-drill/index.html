<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国試ドリル｜理学療法士国家試験</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--sub:#667085;--pri:#ff6b35;--pri2:#ffa41c;--ok:#12a36b;--okbg:#e6f7ef;--ng:#e5484d;--ngbg:#fdeceb;--blue:#3b6cf6;--line:#e6eaf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
h1,h2,h3{margin:0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:18px 18px 56px;border-radius:0 0 28px 28px}
.hero .hi{font-size:13px;opacity:.95}
.hero .cd{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.hero .cd b{font-size:46px;line-height:1}
.hero .msg{margin-top:8px;font-size:13px;background:rgba(255,255,255,.2);padding:8px 12px;border-radius:12px}
.wrap{padding:0 14px}
.pull{margin-top:-40px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(30,40,80,.06)}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sub{color:var(--sub);font-size:12.5px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 4px 0 #d9561f;margin-top:10px;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9561f}
.btn.g{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line);border:1.5px solid var(--line)}
.btn.b{background:var(--blue);box-shadow:0 4px 0 #2a4fc0}
.btn.s{font-size:14px;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#f6f8fc;border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.bar{height:10px;background:#e8edf5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pri2),var(--pri));transition:width .5s}
.bar.g i{background:linear-gradient(90deg,#5ad1a0,var(--ok))}
.bar.bl i{background:linear-gradient(90deg,#7fa0ff,var(--blue))}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line .nm{width:78px;font-size:13px;font-weight:600;flex:none}
.line .bw{flex:1}
.line .pc{width:44px;text-align:right;font-size:13px;font-weight:700;flex:none}
.tb{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;color:#fff;background:#98a2b3}
.tb.t1{background:#f5a524}.tb.t2{background:#f56e2b}.tb.t3{background:#e5484d}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:#eef2fb;color:#44506b;margin-right:6px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--sub);padding:4px;font-family:inherit}
nav button span{display:block;font-size:22px;line-height:1.2}
.stp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 4px;margin:3px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;font-size:11px;color:var(--ink)}
.stp b{font-size:24px;font-weight:400;line-height:1.1}
.stp:disabled{opacity:.4}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#27ae60;margin-right:5px}
.dot{position:absolute;top:0;right:12px;background:#e74c3c;color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
nav button{position:relative}
nav button.on{color:var(--pri);font-weight:700}
input,select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin-top:6px;font-family:inherit;background:#fff}
label{font-size:13px;font-weight:600;display:block;margin-top:12px}
.login{padding:48px 20px}
.login h1{font-size:30px;text-align:center}
.seg{display:flex;background:#e9edf5;border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);font-family:inherit}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.qtop{display:flex;align-items:center;gap:10px;padding:12px 14px}
.qtop .x{border:0;background:#e9edf5;border-radius:50%;width:34px;height:34px;font-size:16px}
.prog{flex:1;height:8px;background:#e1e6f0;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qtext{font-size:16.5px;font-weight:600;line-height:1.75;margin:10px 0}
mark{background:#fff0a8;padding:0 2px;border-radius:3px}
.ch{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px;margin-top:9px;font-size:15.5px;font-family:inherit;color:var(--ink)}
.ch .n{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2fb;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.ch.ok{border-color:var(--ok);background:var(--okbg)}.ch.ok .n{background:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}.ch.ng .n{background:var(--ng);color:#fff}
.ch.dim{opacity:.55}
.fb{border-radius:14px;padding:12px 14px;font-weight:700;margin:10px 0}
.fb.ok{background:var(--okbg);color:#0b7a50}.fb.ng{background:var(--ngbg);color:#b42318}
.box{background:#f6f8fc;border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.box h4{margin:0 0 4px;font-size:13px;color:var(--sub)}
.cex{font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line)}.cex:last-child{border:0}
.tfbtn{display:flex;gap:12px;margin-top:12px}.tfbtn button{flex:1;font-size:34px;padding:12px;border-radius:16px;border:2px solid var(--line);background:#fff;font-family:inherit}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin:8px 0}
.fig svg{width:100%;height:auto;display:block}
.big{font-size:54px;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.tbl tr.cl{cursor:pointer}
textarea{width:100%;min-height:90px;padding:10px;border:1.5px solid var(--line);border-radius:12px;font-size:13px;font-family:monospace}
.toast{background:#1d2433;color:#fff;border-radius:12px;padding:10px 14px;margin:10px 14px;font-size:13px}
.days{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:6px}
.days div{flex:1;text-align:center;font-size:10px;color:var(--sub);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.days i{display:block;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:5px 5px 0 0;min-height:3px}
.kb{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 14px 10px;margin:0 -14px}
.kcol{flex:0 0 80%;scroll-snap-align:start;background:#e9edf7;border-radius:16px;padding:10px}
.kcol h4{margin:2px 4px 8px;font-size:14px;display:flex;justify-content:space-between}
.kc{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(30,40,80,.08);font-size:14px}
.kc.me{border-left:4px solid var(--blue)}
.hr{display:flex;align-items:center;gap:6px;margin-bottom:6px}.hr>span{width:42px;font-size:12px;color:var(--sub)}
.cell{flex:1;height:42px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:11px;color:var(--sub);font-family:inherit;padding:0}
.cell.study{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-color:transparent;font-weight:700}
.cell.class{background:#dbe4f7;color:#2a3c6b;border-color:#c6d4f2}.cell.sp{background:#e9defb;color:#5b3aa3;border-color:#d8c8f7}
#tbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:none;align-items:center;gap:10px;background:#1d2433;color:#fff;padding:8px 14px;font-size:14px}
#tbar .p{flex:1;height:6px;background:#475069;border-radius:4px;overflow:hidden}#tbar .p i{display:block;height:100%;width:0;background:var(--pri2)}
#tbar button{border:0;border-radius:10px;padding:5px 12px;background:#475069;color:#fff;font-family:inherit}
body.tm #app{padding-top:44px}
</style>
</head>
<body>
<div id="tbar"></div>
<div id="app"></div>
<script>
/* ================= 設定 ================= */
const EXAM_DATE='2027-02-21';      // 国家試験日
const ADMIN_PW='';           // 先生用パスワード（運用時に変更）
const GAS_URL='https://script.google.com/macros/s/AKfycbxtpKGp293BGR3wJxWOZx_jz4HsKpE_LYgqDI4BKUCkdGooS_Y51qFYuHoGjrtpjassVA/exec';                   // Google Apps ScriptのURLを入れると学習記録を先生用シートに送信
let AREA_ORDER=['解剖学','生理学','運動学','内部障害','神経系','運動器','発達','精神・心理','評価'];

/* ================= サンプルデータ（本番はadminで差し替え） ================= */
const FIG1='<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg"><g stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round"><line x1="70" y1="30" x2="70" y2="120"/><line x1="70" y1="120" x2="170" y2="120"/></g><line x1="70" y1="30" x2="170" y2="120" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4"/><line x1="70" y1="30" x2="190" y2="30" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="2 4"/><line x1="20" y1="185" x2="280" y2="185" stroke="#cbd5e1" stroke-width="5"/><g fill="#ff6b35"><circle cx="70" cy="30" r="5"/><circle cx="70" cy="120" r="5"/><circle cx="170" cy="120" r="5"/></g><g font-size="17" font-weight="700" fill="#0f766e"><text x="44" y="82">ア</text><text x="108" y="144">イ</text><text x="132" y="64">ウ</text><text x="198" y="36">エ</text><text x="150" y="176">オ</text></g><g font-size="12" fill="#64748b"><text x="80" y="24">肩峰</text><text x="14" y="138">外側上顆</text><text x="176" y="116">茎状突起</text></g></svg>';
const SAMPLE={
exams:[{id:'A',name:'第1回模試'},{id:'B',name:'第2回模試'}],
qs:[
{id:'q01',exam:'A',ses:'午前',no:3,area:'解剖学',q:'大腿四頭筋を支配する神経はどれか。',ch:['閉鎖神経','大腿神経','坐骨神経','上殿神経','脛骨神経'],ans:1,ex:'大腿四頭筋は大腿神経（L2〜L4）の支配である。',cex:['内転筋群を支配する。','大腿四頭筋と縫工筋を支配する。','大腿後面（ハムストリングス）を支配する。','中殿筋・小殿筋・大腿筋膜張筋を支配する。','下腿後面の筋（腓腹筋・ヒラメ筋など）を支配する。'],ask:'筋を支配する神経の名称',askOpts:['筋の起始と停止','筋の作用（運動方向）'],kw:['大腿四頭筋','支配する神経'],cls:88,nat:85,sim:{q:'大腿神経が支配する筋はどれか。',ch:['大腿二頭筋','縫工筋','半膜様筋','長内転筋','中殿筋'],ans:1,ex:'縫工筋は大腿神経支配。大腿二頭筋・半膜様筋は坐骨神経、長内転筋は閉鎖神経、中殿筋は上殿神経。'}},
{id:'q02',exam:'A',ses:'午前',no:8,area:'解剖学',q:'右心房と右心室の間にある弁はどれか。',ch:['僧帽弁','三尖弁','大動脈弁','肺動脈弁','卵円窩'],ans:1,ex:'右房室弁は三尖弁。左房室弁が僧帽弁である。',cex:['左心房と左心室の間の弁。','右房と右室の間の弁（右房室弁）。','左心室と大動脈の間の弁。','右心室と肺動脈の間の弁。','胎生期の卵円孔の名残で弁ではない。'],ask:'弁の「位置（どこの間か）」',askOpts:['弁の「機能不全の症状」','弁の「聴診部位」'],kw:['右心房','右心室の間'],cls:75,nat:72},
{id:'q03',exam:'A',ses:'午前',no:15,area:'生理学',q:'交感神経の興奮で起こるのはどれか。',ch:['瞳孔散大','気管支収縮','消化管運動の亢進','心拍数の減少','唾液の大量分泌'],ans:0,ex:'交感神経は「闘争か逃走」。瞳孔散大・心拍数増加・気管支拡張・消化抑制が起こる。',cex:['交感神経で散瞳する。','交感神経では気管支は拡張する。','交感神経では消化管運動は抑制される。','交感神経では心拍数は増加する。','副交感神経で水様の唾液が多く出る。'],ask:'交感神経興奮時の反応',askOpts:['副交感神経興奮時の反応','自律神経の中枢の場所'],kw:['交感神経','興奮'],cls:82,nat:79,sim:{q:'副交感神経の興奮で起こるのはどれか。',ch:['瞳孔散大','心拍数の増加','気管支拡張','縮瞳','消化管運動の抑制'],ans:3,ex:'副交感神経では縮瞳・心拍数減少・気管支収縮・消化促進が起こる。'}},
{id:'q04',exam:'A',ses:'午前',no:22,area:'生理学',q:'インスリンについて正しいのはどれか。',ch:['膵臓のα細胞から分泌される。','血糖値を上昇させる。','膵臓のβ細胞から分泌される。','脂肪分解を促進する。','副腎皮質から分泌される。'],ans:2,ex:'インスリンは膵ランゲルハンス島のβ細胞から分泌され、血糖を低下させる。',cex:['α細胞はグルカゴンを分泌する。','インスリンは血糖を低下させる。','正しい。β細胞から分泌される。','インスリンは脂肪合成を促進し分解を抑える。','副腎皮質ではコルチゾールなどを分泌する。'],ask:'インスリンの性質（分泌部位・作用）',askOpts:['糖尿病の診断基準','インスリン注射の方法'],kw:['インスリン'],cls:68,nat:64},
{id:'q05',exam:'A',ses:'午前',no:27,area:'運動学',q:'正常歩行の歩行周期で立脚期が占める割合はどれか。',ch:['約40%','約50%','約60%','約70%','約80%'],ans:2,ex:'立脚期は約60%、遊脚期は約40%である。',cex:['遊脚期の割合である。','両者が同じ割合ではない。','立脚期は約60%。','長すぎる。','長すぎる。'],ask:'歩行周期の「立脚期」の割合',askOpts:['歩行速度の目安','歩幅の正常値'],kw:['立脚期','割合'],cls:91,nat:87,sim:{q:'正常歩行の歩行周期で遊脚期が占める割合はどれか。',ch:['約20%','約30%','約40%','約50%','約60%'],ans:2,ex:'遊脚期は約40%（立脚期が約60%）。'}},
{id:'q06',exam:'A',ses:'午前',no:31,area:'運動学',q:'股関節の屈曲に作用する筋はどれか。',ch:['大殿筋','腸腰筋','半膜様筋','梨状筋','小円筋'],ans:1,ex:'腸腰筋は股関節屈曲の主動作筋である。',cex:['股関節伸展・外旋に作用する。','股関節屈曲の主動作筋。','股関節伸展・膝関節屈曲に作用する。','股関節外旋に作用する。','肩関節外旋の筋で股関節には作用しない。'],ask:'股関節「屈曲」に働く筋',askOpts:['股関節「伸展」に働く筋','股関節を支配する神経'],kw:['股関節','屈曲'],cls:72,nat:70},
{id:'q07',exam:'A',ses:'午前',no:38,area:'内部障害',q:'心筋梗塞後の運動療法を中止すべき状態はどれか。',ch:['軽度の息切れ','軽い発汗','胸痛の出現','軽度の疲労感','運動に伴う軽度の心拍数増加'],ans:2,ex:'胸痛（狭心痛）の出現は運動中止基準。',cex:['軽度ならば運動は継続可能なことが多い。','運動に伴う正常反応。','虚血を疑う症状で、直ちに中止する。','運動強度の調整で対応できることが多い。','運動に伴う正常な反応。'],ask:'運動を「中止すべき」状態',askOpts:['運動を「開始してよい」条件','運動の「効果」'],kw:['運動療法','中止'],cls:85,nat:83},

function record(q,ok,sec,mode,chal){
 if(ui.viewAs)return;
 const t=today();U.days[t]=U.days[t]||{n:0,sec:0};U.days[t].n++;U.days[t].sec+=sec;
 U.log.push({qid:q.id,ok:ok?1:0,sec,mode,chal:chal?1:0,ts:Date.now()});
 if(U.log.length>3000)U.log=U.log.slice(-3000);
 if(!chal){const s=U.q[q.id]||(U.q[q.id]={streak:0,tries:0,wrong:0});s.tries++;if(ok)s.streak++;else{s.streak=0;s.wrong++}}
 saveU();
}

function startSession(ids,mode,title,chal){
 if(ui.viewAs){ui.msg='閲覧専用のため、問題は解けません';render();return}
 if(!ids.length){ui.msg='この条件の問題はありません。条件を変えてみよう。';render();return}
 sess={queue:ids.map(id=>({id,chal:!!chal,rep:0})),i:0,mode,title,correct:0,sec:0,newM:0,wrongIds:[],answered:0};
 resetQ();ui.screen='quiz';render();window.scrollTo(0,0);
}
function resetQ(){Object.assign(sess,{phase:'ans',t0:Date.now(),pick:null,sel:[],ok:null,askPick:null,hint:false,tfI:0,tf:[],tfShow:false,msg:'',askOpts:null})}
const A=q=>Array.isArray(q.ans)?q.ans:[q.ans];
const pickN=q=>q.pick||A(q).length;
const okSets=q=>[A(q),...(q.alt||[])];
const allOk=q=>[...new Set(okSets(q).flat())];
const isOk=(q,arr)=>{const g=[...arr].sort().join();return okSets(q).some(o=>[...o].sort().join()===g)};
function curQ(){const e=sess.queue[sess.i];const b=DATA.qs.find(q=>q.id===e.id);if(e.chal){const s=b.sim;return{...b,id:b.id+'s',q:s.q,ch:s.ch,ans:s.ans,alt:null,pick:1,ex:s.ex,cex:null,fig:null,imgs:null,_chal:true,_base:b}}return b}
function askInfoFor(b){
 if(b.ask&&b.askOpts)return{correct:b.ask,opts:shuffle([b.ask,...b.askOpts])};
 if(!b.kw||!b.kw.length)return null;
 const correct=b.kw.join('・');const pool=DATA.qs.filter(x=>x.id!==b.id&&x.kw&&x.kw.length&&x.kw.join('・')!==correct);
 const d=[...shuffle(pool.filter(x=>x.area===b.area)),...shuffle(pool.filter(x=>x.area!==b.area))].slice(0,2).map(x=>x.kw.join('・'));
 return d.length?{correct,opts:shuffle([correct,...d])}:null;
}
function choose(i){const q=curQ();if(pickN(q)<=1){pick([i]);return}const k=sess.sel.indexOf(i);if(k>=0)sess.sel.splice(k,1);else if(sess.sel.length<pickN(q))sess.sel.push(i);render()}
function submitSel(){const q=curQ();if(sess.sel.length===pickN(q))pick([...sess.sel])}
function pick(arr){
 const q=curQ(),e=sess.queue[sess.i],base=q._base||q;
 const sec=Math.min(600,Math.round((Date.now()-sess.t0)/1000));const ans=A(q);
 const ok=isOk(q,arr);
 const before=!e.chal&&need(base);
 record(base,ok,sec,sess.mode,e.chal);
 const after=!e.chal&&need(base);
 sess.pick=arr;sess.ok=ok;sess.sec+=sec;sess.answered++;
 if(ok)sess.correct++;else if(!sess.wrongIds.includes(base.id))sess.wrongIds.push(base.id);
 let m=ok?rnd(PRAISE):rnd(GENTLE);
 if(before&&!after){sess.newM++;m='🎉 この問題を制覇！'}
 if(e.chal&&ok)m='🌟 チャレンジ成功！応用力がついてきた！';
 sess.msg=m;
 if(!ok&&!e.chal&&e.rep<2)sess.queue.splice(Math.min(sess.i+4,sess.queue.length),0,{id:e.id,chal:false,rep:e.rep+1});
 sess.askInfo=ok?null:askInfoFor(base);
 sess.phase=(ok||!sess.askInfo)?'exp':'ask';
 render();window.scrollTo(0,0);
}
function askPick(j){sess.askPick=j;render()}
function toExp(){sess.phase='exp';render();window.scrollTo(0,0)}
function toggleHint(){sess.hint=!sess.hint;render()}
function startTF(){sess.phase='tf';sess.tfI=0;sess.tf=[];sess.tfShow=false;render();window.scrollTo(0,0)}
function tfPick(v){const q=curQ();const truth=allOk(q).includes(sess.tfI);sess.tf[sess.tfI]={v,right:v===truth};sess.tfShow=true;render()}
function tfNext(){const q=curQ();if(sess.tfI+1>=q.ch.length){sess.phase='tfdone'}else{sess.tfI++;sess.tfShow=false}render();window.scrollTo(0,0)}
function nextQ(){if(sess.i+1>=sess.queue.length){ui.screen='result'}else{sess.i++;resetQ()}render();window.scrollTo(0,0)}
function quit(){go('home')}
const figHtml=q=>{let h='';if(q.fig)h+=`<div class="fig">${q.fig}</div>`;(q.imgs||[]).forEach(s=>{h+=`<div class="fig"><img src="${esc(s)}" loading="lazy" onclick="zoom(this.src)" style="width:100%;display:block"></div>`});return (q.imgs&&q.imgs.length?'<div class="sub">画像をタップで拡大</div>':'')+h};
function zoom(src){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;overflow:auto;padding:10px';d.innerHTML=`<div style="color:#fff;font-size:13px;margin-bottom:6px">タップで閉じる</div><img src="${src}" style="width:220%;max-width:none;background:#fff">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const chips=k=>(k||[]).map(x=>`<mark>${esc(x)}</mark>`).join(' ');
function keyBox(b){return b.ask?`<div class="box"><h4>問題のカギ</h4>問われていたのは「<b>${esc(b.ask)}</b>」　${chips(b.kw)}</div>`:((b.kw&&b.kw.length)?`<div class="box"><h4>この問題のキーワード</h4>${chips(b.kw)}</div>`:'')}

function quizView(){
 const q=curQ(),base=q._base||q,e=sess.queue[sess.i],ans=A(q),multi=pickN(q)>1;
 const total=sess.queue.length,pg=Math.round(sess.i/total*100);
 const showKw=sess.hint||sess.phase!=='ans';
 const lab=(c,i)=>base.imgchoice&&!q._chal?`図の選択肢 ${i+1}`:esc(c);
 let h=`<div class="qtop"><button class="x" onclick="quit()">✕</button><div class="prog"><i style="width:${pg}%"></i></div><span class="sub">${sess.i+1}/${total}</span></div><div class="wrap">`;
 h+=`<div class="card"><div><span class="chip">${esc(base.area)}</span><span class="chip">${esc(examName(base.exam))} ${esc(base.ses)}${base.no}</span>${e.chal?'<span class="tb t2">チャレンジ</span>':(need(base)?tb(tier(rate(base))):'')}${e.rep?'<span class="chip">もう一度</span>':''}${multi?`<span class="tb t2">${pickN(q)}つ選ぶ</span>`:''}${sess.phase==='ans'?'<span class="chip" id="tm" style="float:right">0秒</span>':''}</div>`;
 h+=`<div class="qtext">${hl(q.q,showKw?base.kw:[])}</div>${figHtml(q)}`;
 if(sess.phase==='ans'){
  h+=q.ch.map((c,i)=>`<button class="ch ${sess.sel.includes(i)?'ok':''}" onclick="choose(${i})"><span class="n">${i+1}</span><span>${lab(c,i)}</span></button>`).join('');
  if(multi)h+=`<button class="btn ${sess.sel.length===pickN(q)?'':'g'} s" onclick="submitSel()">回答する（${sess.sel.length}/${pickN(q)}）</button>`;
  if(base.ask||(base.kw&&base.kw.length)){
   h+=`<button class="btn g s" onclick="toggleHint()">🔍 ${sess.hint?'ヒントをとじる':'問題のカギを見る（何を聞かれている？）'}</button>`;
   if(sess.hint)h+=base.ask?`<div class="box"><h4>この問題で問われていること</h4><b>${esc(base.ask)}</b><div class="sub" style="margin-top:4px">黄色のキーワードに注目して選択肢を読もう</div></div>`:`<div class="box"><h4>この問題のテーマ（キーワード）</h4>${chips(base.kw)}<div class="sub" style="margin-top:4px">このテーマの知識を思い出して選ぼう</div></div>`;
  }
 }else{
  h+=q.ch.map((c,i)=>`<div class="ch ${allOk(q).includes(i)?'ok':(sess.pick.includes(i)?'ng':'dim')}"><span class="n">${i+1}</span><span>${lab(c,i)}</span></div>`).join('');
  h+=`<div class="fb ${sess.ok?'ok':'ng'}">${sess.ok?'⭕ 正解！':'❌ 不正解（正解は '+ans.map(x=>x+1).join('・')+(q.alt&&q.alt.length?'、または '+q.alt.map(o=>o.map(x=>x+1).join('・')).join('／'):'')+'）'}　${esc(sess.msg)}</div>`;
 }
 h+='</div>';
 if(sess.phase==='ask'){
  const ai=sess.askInfo;
  h+=`<div class="card"><h3>🔍 まず確認：この問題が聞いているテーマは？</h3><div class="sub">設問を読み違えていないかチェックしよう</div>`;
  ai.opts.forEach((o,j)=>{let c='';if(sess.askPick!==null){c=o===ai.correct?'ok':(j===sess.askPick?'ng':'dim')}h+=`<button class="ch ${c}" ${sess.askPick===null?`onclick="askPick(${j})"`:''}><span class="n">${'ABC'[j]}</span><span>${esc(o)}</span></button>`});
  if(sess.askPick!==null){h+=`<div class="box"><h4>${ai.opts[sess.askPick]===ai.correct?'その通り！':'正しくはこちら'}</h4>この問題のテーマは「<b>${esc(ai.correct)}</b>」。${chips(base.kw)}</div><button class="btn" onclick="toExp()">解説を見る</button>`}
  h+='</div>';
 }
 if(sess.phase==='exp'){
  const showCex=!sess.ok&&q.cex&&q.cex.some(x=>x);
  h+=`<div class="card"><h3>📘 解説</h3>`;
  if(!showCex)h+=`<div style="font-size:14px">${esc(q.ex||'（解説は準備中です）')}</div>`;
  h+=keyBox(base);
  if(showCex)h+=`<div class="box"><h4>選択肢ごとの解説</h4>${q.cex.map((c,i)=>`<div class="cex"><b>${i+1}.</b> ${esc(q.ch[i])}<br><span class="sub">${allOk(q).includes(i)?'⭕ ':'✖ '}${esc(c||'')}</span></div>`).join('')}</div>`;
  if(!sess.ok)h+=`<button class="btn b" onclick="startTF()">⭕❌ 5択がむずかしい？ ○×で1つずつ確認</button>`;
  h+=`<button class="btn g s" onclick="apptQ()">👩‍🏫 この問題を先生に質問する</button><button class="btn" onclick="nextQ()">${sess.i+1>=sess.queue.length?'結果を見る':'つぎへ'} ▶</button></div>`;
 }
 if(sess.phase==='tf'){
  const t=sess.tfI;
  h+=`<div class="card"><h3>⭕❌ ○×チェック ${t+1}/${q.ch.length}</h3><div class="sub">${multi?'この選択肢は、正解に含まれる？':'この選択肢は、問題の答えとして正しい？'}</div><div class="box" style="font-size:16px;font-weight:600">${lab(q.ch[t],t)}</div>`;
  if(!sess.tfShow){h+=`<div class="tfbtn"><button onclick="tfPick(true)">⭕</button><button onclick="tfPick(false)">❌</button></div>`}
  else{const r=sess.tf[t];const truth=allOk(q).includes(t);const note=q.cex&&q.cex[t]?q.cex[t]:'';h+=`<div class="fb ${r.right?'ok':'ng'}">${r.right?'正解！':'おしい！'} この選択肢は${truth?'⭕（正解に含まれる）':'❌（正解ではない）'}</div>${note?`<div class="box">${esc(note)}</div>`:''}<button class="btn" onclick="tfNext()">${t+1>=q.ch.length?'まとめを見る':'つぎの選択肢'} ▶</button>`}
  h+='</div>';
 }
 if(sess.phase==='tfdone'){
  const c=sess.tf.filter(x=>x.right).length;
  h+=`<div class="card"><h3>✨ ○×チェック完了</h3><div class="big">${c}/${q.ch.length}</div><div style="text-align:center">${c===q.ch.length?'全部わかった！5択でも自信を持って！':'1つずつ見ると理解が深まるね。もう一度5択に挑戦しよう！'}</div><button class="btn" onclick="nextQ()">${sess.i+1>=sess.queue.length?'結果を見る':'つぎへ'} ▶</button></div>`;
 }
 return h+'</div>';
}

function resultView(){

}

function mission(){
 let best=null;AR().forEach(a=>{const l=needList(q=>q.area===a&&rate(q)>=60);if(l.length){const w=l.reduce((s,q)=>s+tier(rate(q)),0);if(!best||w>best.w)best={area:a,list:l.slice(0,10),w}}});return best;
}
function startMission(){const m=mission();if(m)startSession(m.list.map(q=>q.id),'mission','今日の課題：'+m.area);else startChallenge()}
function startRecommend(){const l=needList().slice(0,10);if(l.length)startSession(l.map(q=>q.id),'recommend','今日のおすすめ');else startChallenge()}
function startReview(){const l=needList();startSession(l.slice(0,20).map(q=>q.id),'review','間違えた問題の復習')}
function startChallenge(){const all=DATA.qs.filter(q=>q.sim);const pr=shuffle(all.filter(q=>need(q))),rest=shuffle(all.filter(q=>!need(q)));const l=[...pr,...rest];if(!l.length){ui.msg='類似問題のチャレンジは準備中です（これから追加されます）';render();return}startSession(l.slice(0,10).map(q=>q.id),'challenge','チャレンジ（類似問題）',true)}
function startArea(a){const l=needList(q=>q.area===a);const ids=l.length?l:DATA.qs.filter(q=>q.area===a);startSession(ids.slice(0,20).map(q=>q.id),'area','領域：'+a)}
function startFilter(){
 const f=ui.f;let l=DATA.qs.filter(q=>(f.exam==='all'||q.exam===f.exam)&&(f.ses==='all'||q.ses===f.ses)&&(!f.prac||q.no<=20)&&(f.area==='all'||q.area===f.area));
 if(f.only==='need'){l=l.filter(need).sort((a,b)=>tier(rate(b))-tier(rate(a))||rate(b)-rate(a))}else{l=l.sort((a,b)=>a.exam.localeCompare(b.exam)||a.ses.localeCompare(b.ses)||a.no-b.no)}
 startSession(l.slice(0,20).map(q=>q.id),'filter','えらんだ条件');
}

/* ---- タイマー（ピッ！） ---- */
let TM=null,AC=null;
function beep(n,f){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=AC||new C();if(AC.state==='suspended')AC.resume();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)}}catch(e){}}
function startTimer(min){beep(1,1046);TM={start:Date.now(),end:Date.now()+min*60000,min};const b=$('#tbar');b.style.display='flex';b.innerHTML=`<span>⏱ 集中</span><b id="tl" style="font-size:18px"></b><div class="p"><i id="tp"></i></div><button onclick="finishTimer(false)">やめる</button>`;document.body.classList.add('tm');tick()}
function tick(){if(!TM)return;const rem=TM.end-Date.now();if(rem<=0){finishTimer(true);return}const l=$('#tl'),p=$('#tp');if(l)l.textContent=pad(Math.floor(rem/60000))+':'+pad(Math.floor(rem%60000/1000));if(p)p.style.width=Math.round((1-rem/(TM.min*60000))*100)+'%'}
function finishTimer(done){if(!TM)return;const t=TM;TM=null;const mins=done?t.min:Math.floor((Date.now()-t.start)/60000);if(me&&mins>0){U.focus[today()]=(U.focus[today()]||0)+mins;saveU()}const b=$('#tbar');if(done){beep(3,784);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}b.innerHTML=`<span style="flex:1">✅ ${t.min}分おつかれさま！よく集中できました</span><button onclick="hideBar()">OK</button>`}else hideBar();if(me)render()}
function hideBar(){$('#tbar').style.display='none';document.body.classList.remove('tm')}
setInterval(tick,250);

/* ---- みんなの進捗（名前なし） ---- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function peerMins(k){if(PEER&&PEER.length>=5){const wd=weekDays().map(dstr),t=today();return PEER.map(m=>k==='d'?(m[t]||0):wd.reduce((a,d)=>a+(m[d]||0),0))}const ds=dstr(k==='w'?weekDays()[0]:new Date());let seed=0;for(const c of ds+k)seed=(seed*31+c.charCodeAt(0))|0;const r=mulberry(seed);const out=[];for(let i=0;i<47;i++){const x=r();out.push(k==='d'?(x<.22?0:x<.42?Math.floor(r()*30):x<.7?30+Math.floor(r()*30):x<.9?60+Math.floor(r()*30):90+Math.floor(r()*60)):(x<.1?0:Math.floor(r()*r()*420)+(x>.6?30:0)))}return out}
function peerCard(){
 const k=ui.pk||'d';const edges=k==='d'?[0,1,15,30,45,60]:[0,1,60,120,180,240];
 const labs=k==='d'?['0','1〜14','15〜29','30〜44','45〜59','60〜']:['0','1〜59','60〜119','120〜179','180〜239','240〜'];
 const bin=m=>{let b=0;edges.forEach((e,i)=>{if(m>=e)b=i});return b};
 const others=peerMins(k);const own=k==='d'?studyMin(today()):weekDays().reduce((s,d)=>s+studyMin(dstr(d)),0);
 const cnt=[0,0,0,0,0,0];others.forEach(m=>cnt[bin(m)]++);cnt[bin(own)]++;
 const total=others.length+1,mx=Math.max(...cnt),thr=k==='d'?30:150,ok=others.filter(m=>m>=thr).length+(own>=thr?1:0),ob=bin(own);
 return `<div class="card"><h3>👥 みんなの勉強時間</h3><div class="seg"><button class="${k==='d'?'on':''}" onclick="ui.pk='d';render()">今日</button><button class="${k==='w'?'on':''}" onclick="ui.pk='w';render()">今週</button></div>
 <div style="font-weight:700">${k==='d'?'30分':'150分'}以上勉強した人：${ok}人（${Math.round(ok/total*100)}%）</div>
 <div style="display:flex;gap:4px;align-items:flex-end;margin-top:8px">${cnt.map((c,i)=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:84px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">${i===ob?'<div style="color:var(--blue);font-weight:700">▼あなた</div>':''}<div style="width:70%;height:${c?Math.round(c/mx*56)+4:0}px;background:${i===ob?'var(--blue)':'#c9d3ea'};border-radius:6px 6px 0 0"></div></div><b>${c}</b>人<br><span class="sub">${labs[i]}分</span></div>`).join('')}</div>
 <div style="margin-top:8px">あなたは${k==='d'?'今日':'今週'} <b>${own}分</b>。${own>=thr?'いいペース！この調子！':'あと'+(thr-own)+'分で'+(k==='d'?'30分':'今週の目安')+'に届くよ。'}</div>
 <div class="sub" style="margin-top:6px">※ 名前は出ません。${PEER&&PEER.length>=5?'クラウドに集まった仲間の記録（'+PEER.length+'人）です。':'いまは見本のデモ表示です（5人以上の記録が集まると本物の分布になります）。'}</div></div>`;
}

function parseCsv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x!==''))rows.push(r);return rows}
function importVendor(text,examId,extName){
 const rows=parseCsv(text.replace(/^﻿/,''));let n=0,m=0;
 if(examId==='__ext'){
  const xn=(extName||'').trim(),xid='x'+norm(xn);const cr=rows.find(r=>(r[0]||'').trim()==='CORRECT')||[],cat=rows.find(r=>(r[0]||'').trim()==='CATEGORY')||[];
  const ds=c=>((c||'').match(/\d/g)||[]).sort().join('');const N=cr.length-1;
  rows.forEach(r=>{const id=(r[0]||'').trim();if(!id||id==='学生ID'||['CORRECT','CATEGORY','NATIONAL'].includes(id))return;
   const key=norm(id);let s=DATA.students.find(x=>x.id===key);if(!s){s={id:key,name:id.replace(/　/g,' '),type:(r[1]||'').trim(),sid:'',res:{}};DATA.students.push(s);n++}
   const half=j=>j<=100?0:1;const blank=[0,1].map(h=>{let any=false;for(let j=1;j<=N;j++)if(half(j)===h&&(r[1+j]||'').trim())any=true;return !any});
   const areas={};let c=0,t=0;
   for(let j=1;j<=N;j++){if(blank[half(j)])continue;const a=(cat[1+j]||'その他').trim()||'その他';const ok=ds(r[1+j])===ds(cr[1+j]);(areas[a]=areas[a]||[0,0]);areas[a][1]++;t++;if(ok){areas[a][0]++;c++}}
   s.ext=s.ext||{};if(t){s.ext[xid]={name:xn,areas,c,n:t};m+=t}});
  applyRoster();saveStudents();return{n,m,total:DATA.students.length};
 }
 const qs=DATA.qs.filter(q=>q.exam===examId);
 rows.forEach(r=>{const id=(r[0]||'').trim();if(!id||id==='学生ID'||['CORRECT','CATEGORY','NATIONAL'].includes(id))return;
  const key=norm(id);let s=DATA.students.find(x=>x.id===key);if(!s){s={id:key,name:id.replace(/　/g,' '),type:(r[1]||'').trim(),sid:'',res:{}};DATA.students.push(s);n++}
  s.type=(r[1]||s.type||'').trim();
  const blankSes={};['午前','午後'].forEach(se=>{const l=qs.filter(q=>q.ses===se);blankSes[se]=l.length&&l.every(q=>!((r[1+q.gn]||'').trim()))});
  qs.forEach(q=>{const cell=r[1+q.gn];if(cell===undefined||blankSes[q.ses])return;const got=(cell.match(/\d/g)||[]).map(x=>+x-1);s.res[q.id]=isOk(q,got)?1:0;m++})});
 applyRoster();saveStudents();return{n,m,total:DATA.students.length};
}

let DB=null,UID=null,PEER=null,GASAUTH=null;
async function gas(o){const c=new AbortController();const t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(o),signal:c.signal});return await r.json()}finally{clearTimeout(t)}}
const CL={st:'確認中',sig:{},err:'',last:0};
const hs=t=>{let h=5381;for(const c of String(t))h=((h<<5)+h+c.charCodeAt(0))|0;return 'k'+(h>>>0).toString(36)+String(t).length.toString(36)};
async function cloudInit(){
 if(GAS_URL){CL.st='Googleスプレッドシート連携';return}
 try{const c=window.claude;DB=c&&c.use?await c.use('db'):null;const u=c&&c.use?await c.use('user'):null;UID=u&&u.id?await u.id():null}catch(e){DB=null}
 if(!DB){CL.st='オフライン（この端末だけに保存）';if(ui.screen==='admin')render();return}
 CL.st='接続OK';await pullRoster();await pullPeers();if(ui.screen==='login'||ui.screen==='admin')render();
}
function mergeSt(c){const l=DATA.students.find(x=>x.id===c.id);if(!l){DATA.students.push(c);return}
 const nl=Object.keys(l.res||{}).length,nc=Object.keys(c.res||{}).length;
 l.res=Object.assign({},c.res,l.res);if(nc>nl)l.res=Object.assign({},l.res,c.res);
 l.ext=Object.assign({},c.ext||{},l.ext||{});l.sid=l.sid||c.sid;l.type=l.type||c.type}
async function pullRoster(){try{const sn=await DB.collection('roster').get();let n=0;sn.docs.forEach(d=>{const x=(d.data()||{}).s;if(x&&x.id){mergeSt(x);n++}});if(n){applyRoster();saveStudents()}CL.st='接続OK（クラウドの名簿 '+n+'名）'}catch(e){CL.err=e.code||'error'}}
async function pushRoster(){
 if(GAS_URL){let n=0,bad=0;const todo=DATA.students.filter(s=>CL.sig[hs(s.id)]!==JSON.stringify(s));
  for(let i=0;i<todo.length;i+=3){const ch=todo.slice(i,i+3);let ok=false;
   for(let t=0;t<3&&!ok;t++){try{const r=await gas({a:'putStudents',pw:ADMINPW,students:ch});if(r.ok){ok=true;n+=ch.length;ch.forEach(s=>CL.sig[hs(s.id)]=JSON.stringify(s))}else CL.err=r.error||'error'}catch(e){CL.err=(e&&e.name==='AbortError')?'時間切れ':'通信エラー'}if(!ok)await new Promise(r=>setTimeout(r,1500))}
   if(!ok)bad+=ch.length}
  CL.last=Date.now();ui.msg=bad?`スプレッドシート保存：${n}名保存、${bad}名は失敗（${CL.err}）`:`スプレッドシートに ${n}名分を保存しました`;render();return}
 if(!DB){ui.msg='クラウドに接続できていません（この端末にだけ保存されています）';render();return}
 let n=0,ng=0;
 for(const s of DATA.students){const j=JSON.stringify(s),k=hs(s.id);if(CL.sig[k]===j)continue;
  try{await DB.doc('roster/'+k).set({s});CL.sig[k]=j;n++}catch(e){ng++;CL.err=e.code||'error';if(e.code==='invalid_argument'||e.code==='resource_exhausted')break}
  await new Promise(r=>setTimeout(r,120))}
 CL.last=Date.now();ui.msg=ng?`クラウド保存：${n}名保存、${ng}名は失敗（先生アカウント〔編集者以上〕で開いているか確認してください）`:`クラウド保存：${n}名分を保存しました`;render();
}

}

function sendStamp(id,k){const td=U.days[today()]||{n:0};if(td.n<CHEER_OPEN){ui.msg=`今日${CHEER_OPEN}問解くと、スタンプが送れます（あと${CHEER_OPEN-td.n}問）`;render();return}if(CH.sent>=CHEER_MAX){ui.msg=`今日は${CHEER_MAX}回まで送れます`;render();return}ui.cheerSel=null;pulse({to:id,stamp:k})}
function selCheer(id){ui.cheerSel=ui.cheerSel===id?null:id;render()}
function cheerView(){
 if(!chOn())return `<div class="hero" style="padding-bottom:30px"><div class="hi">🙌 応援ルーム</div></div><div class="wrap pull"><div class="card"><div class="sub">この機能は、公開版のアプリ（GitHub Pages）で使えます。</div></div></div>`+nav('cheer');
 const c=chSet(),td=U.days[today()]||{n:0},open=td.n>=CHEER_OPEN,left=Math.max(0,CHEER_MAX-CH.sent);
 const un=CH.inbox.filter(x=>x.ts>(c.seen||0)).length;
 if(CH.inbox.length&&CH.inbox[0].ts>(c.seen||0)){setTimeout(()=>{if(ui.screen==='cheer'&&me){chSet().seen=Date.now();saveU()}},1500)}
 let h=`<div class="hero" style="padding-bottom:30px"><div class="hi">🙌 応援ルーム</div><div class="cd"><b>${CH.ok?CH.studying:'-'}</b><span>人が勉強中</span></div><div class="msg">勉強したら、スタンプで仲間を応援しよう。</div></div><div class="wrap pull">${toast()}`;
 h+=`<div class="card"><h3>🏁 クラスの今週の目標</h3><div class="bar"><i style="width:${Math.min(100,Math.round(CH.week/WEEK_GOAL*100))}%"></i></div><div class="sub" style="margin-top:6px">みんなで ${CH.week} / ${WEEK_GOAL}問　（今日のクラス合計 ${CH.today}問）</div></div>`;
 h+=`<div class="card"><h3>🎁 スタンプ</h3>${open?`<div>今日あと <b>${left}</b> 回、送れます。</div>`:`<div>🔒 あと <b>${CHEER_OPEN-td.n}</b> 問解くと、スタンプが送れます。</div>`}<div class="sub">同じ人には1日1回。成績や正解数は表示されません（解いた量だけ）。</div></div>`;
 h+=`<div class="card"><h3>💌 届いた応援${un?` <span class="tb t3">${un}</span>`:''}</h3>${CH.inbox.length?CH.inbox.slice(0,15).map(x=>{const st=CHEER_STAMPS[x.k]||['🙌','']; return `<div class="line"><div class="nm" style="width:auto;font-size:24px">${st[0]}</div><div class="bw" style="font-size:14px"><b>${esc(x.from)}</b>さんから「${esc(st[1])}」</div><div class="pc sub" style="width:auto">${new Date(x.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div></div>`}).join(''):'<div class="sub">まだ届いていません。まずは自分から送ってみよう！</div>'}</div>`;
 const feed=[...CH.feed].sort((a,b)=>b.studying-a.studying||b.n-a.n);
 h+=`<div class="card"><h3>👥 みんなの様子</h3>${feed.length?feed.map(m=>{const sel=ui.cheerSel===m.id,done=CH.sentTo.includes(m.id);
   return `<div class="line" onclick="${m.r&&open&&!done&&left?`selCheer('${esc(m.id)}')`:''}" style="flex-wrap:wrap;cursor:${m.r&&open&&!done&&left?'pointer':'default'}"><div class="bw" style="font-size:15px">${m.studying?'<span class="live"></span>':''}<b>${esc(m.name)}</b>${m.studying?'　勉強中':''}</div><div class="sub" style="white-space:nowrap">今日${m.n}問${m.streak>1?`・🔥${m.streak}日`:''}</div><div style="width:34px;text-align:right">${!m.r?'🔕':done?'✅':(open&&left?'👉':'')}</div>${sel?`<div style="width:100%;margin-top:4px">${CHEER_STAMPS.map((st,k)=>`<button class="stp" onclick="event.stopPropagation();sendStamp('${esc(m.id)}',${k})"><b>${st[0]}</b>${esc(st[1])}</button>`).join('')}</div>`:''}</div>`}).join(''):'<div class="sub">表示を「見せる」にしている人が、ここに並びます。</div>'}</div>`;
 h+=`<div class="card"><h3>⚙️ 自分の設定</h3>
  <label>みんなへの表示名</label>
  <div style="display:flex;gap:6px;margin-bottom:8px">${[['anon','匿名'],['nick','ニックネーム'],['real','実名']].map(x=>`<button class="btn ${c.mode===x[0]?'':'g'} s" style="margin:0" onclick="setCh('mode','${x[0]}')">${x[1]}</button>`).join('')}</div>
  ${c.mode==='nick'?`<input value="${esc(c.nick||'')}" maxlength="8" placeholder="ニックネーム（8文字まで）" onchange="setCh('nick',this.value.trim().slice(0,8))">`:''}
  <div class="sub">現在の表示：<b>${esc(c.mode==='real'?me.name:(c.mode==='nick'&&c.nick?c.nick:'匿名さん'))}</b></div>
  <label style="margin-top:10px">みんなの一覧に自分を</label>
  <div style="display:flex;gap:6px"><button class="btn ${c.show?'':'g'} s" style="margin:0" onclick="setCh('show',true)">見せる</button><button class="btn ${c.show?'g':''} s" style="margin:0" onclick="setCh('show',false)">見せない</button></div>
  <div class="sub">見せない場合も、「勉強中の人数」には数えられます（名前は出ません）。</div>
  <label style="margin-top:10px">スタンプの受け取り</label>
  <div style="display:flex;gap:6px"><button class="btn ${c.recv!==false?'':'g'} s" style="margin:0" onclick="setCh('recv',true)">受け取る</button><button class="btn ${c.recv!==false?'g':''} s" style="margin:0" onclick="setCh('recv',false)">受け取らない</button></div>
  <div class="sub">公開される情報は「今日の問題数・連続日数・勉強中かどうか」だけです。正解数や得点は誰にも見えません。</div></div>`;
 return h+'</div>'+nav('cheer');
}

/* ================= 先生用：勉強状況と応援ルーム ================= */
async function pullRoom(){
 if(!GAS_URL){ui.msg='この機能は公開版（GitHub Pages）で使えます';render();return}
 try{const r=await gas({a:'adminRoom',pw:ADMINPW});if(!r.ok)throw new Error(r.error||'error');ui.room=r;ui.msg='勉強状況を更新しました（'+r.list.length+'名）'}catch(e){ui.msg='取得に失敗しました（'+(e.message||'通信エラー')+'）。Apps Scriptを新しいバージョンでデプロイしたか確認してください'}render();
}
async function hideNick(id,hide){
 try{const r=await gas({a:'adminNick',pw:ADMINPW,id,hide});if(!r.ok)throw new Error(r.error);ui.msg=hide?'表示名を「匿名さん」にしました':'表示名の制限を解除しました';await pullRoom()}catch(e){ui.msg='変更できませんでした（'+(e.message||'通信エラー')+'）';render()}
}
function setRmSort(k){ui.rmSort=k;render()}
const ago=ms=>{if(!ms)return '-';const m=Math.round((Date.now()-ms)/60000);if(m<1)return 'いま';if(m<60)return m+'分前';const h=Math.round(m/60);if(h<24)return h+'時間前';return Math.round(h/24)+'日前'};
function roomAdminCard(){
 let h=`<div class="card"><h3>👥 勉強状況と応援ルーム</h3><div class="sub">学生がアプリを開いた記録です。先生には、匿名・ニックネームの学生も実名で表示されます（学生には事前に伝えておきましょう）。</div><button class="btn s" onclick="pullRoom()">🔄 最新の状況を読み込む</button>`;
 const R=ui.room;if(!R)return h+'</div>';
 const k=ui.rmSort||'old';let L=[...R.list];
 L.sort(k==='old'?(a,b)=>(a.lastStudy||0)-(b.lastStudy||0):k==='today'?(a,b)=>b.n-a.n:(a,b)=>b.nw-a.nw);
 const used=L.filter(x=>x.used).length,stu=L.filter(x=>x.studying).length,td=L.reduce((s,x)=>s+x.n,0),wk=L.reduce((s,x)=>s+x.nw,0),vis=L.filter(x=>x.show).length;
 h+=`<div class="grid3" style="margin-top:10px"><div class="stat"><b>${stu}</b><span class="sub">いま勉強中</span></div><div class="stat"><b>${used}/${L.length}</b><span class="sub">応援ルーム利用</span></div><div class="stat"><b>${td}</b><span class="sub">今日の合計(問)</span></div></div><div class="sub" style="margin-top:6px">今週の合計 ${wk}問　／　一覧に公開している学生 ${vis}名</div>`;
 h+=`<div style="display:flex;gap:6px;margin:8px 0">${[['old','最終勉強が古い順'],['today','今日の問題数'],['week','今週の問題数']].map(x=>`<button class="btn ${k===x[0]?'':'g'} s" style="margin:0;padding:8px 4px;font-size:12px" onclick="setRmSort('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
 h+=`<table class="tbl"><tr><th>学生</th><th>今日</th><th>今週</th><th>連続</th><th>最終勉強</th></tr>${L.map(x=>`<tr><td>${x.studying?'<span class="live"></span>':''}${esc(x.name)}<br><span class="sub">${x.used?`表示：${esc(x.disp)}${x.show?'（公開）':'（非公開）'}${x.recv?'':'・受取オフ'}${x.hidden?'・制限中':''}`:'未使用'}${x.used?`<br>送${x.sent}／受${x.recvN}`:''}</span>${x.used&&x.disp&&x.disp!=='匿名さん'&&x.mode!=='real'?` <a href="#" onclick="hideNick('${esc(x.id)}',true);return false" class="sub">匿名にする</a>`:''}<br><a href="#" onclick="viewAs('${esc(x.id)}');return false" class="sub">👁 画面を見る</a>${x.hidden?` <a href="#" onclick="hideNick('${esc(x.id)}',false);return false" class="sub">制限を解除</a>`:''}</td><td>${x.n}</td><td>${x.nw}</td><td>${x.streak||0}日</td><td>${ago(x.lastStudy||x.lastPush)}</td></tr>`).join('')}</table></div>`;
 return h;
}

async function viewAs(id){
 if(!GAS_URL){const s=DATA.students.find(x=>x.id===id);if(!s){ui.msg='学生データがありません';render();return}me=s;U=JSON.parse(JSON.stringify(store.get('kd_u_'+id,{q:{},log:[],days:{}})));ui.viewAs=true;initU();CH={feed:[],studying:0,today:0,week:0,sent:0,sentTo:[],inbox:[],ok:false,busy:false,ts:0,res:''};go('home');return}
 try{const r=await gas({a:'adminStudent',pw:ADMINPW,id});if(!r.ok)throw new Error(r.error||'error');
  me=r.s;U=Object.assign({q:{},log:[],days:{}},r.U||{});ui.viewAs=true;initU();ui.sel=null;ui.cheerSel=null;CH={feed:[],studying:0,today:0,week:0,sent:0,sentTo:[],inbox:[],ok:false,busy:false,ts:0,res:''};go('home')}
 catch(e){ui.msg='学生の画面を開けませんでした（'+(e.message||'通信エラー')+'）。Apps Scriptを新しいバージョンでデプロイしたか確認してください';render()}
}
function exitView(){me=null;U=null;sess=null;ui.viewAs=false;ui.msg=null;go('admin')}

loadBank();
